<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>权限检测中心</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; font-family: system-ui, -apple-system, "PingFang SC", sans-serif;
    background: #0b0d17; color: #e8eaf6; overflow-x: hidden; }
  body::before { content: ''; position: fixed; inset: 0; pointer-events: none;
    background: radial-gradient(circle at 15% 10%, rgba(91,141,239,.22), transparent 42%),
                radial-gradient(circle at 85% 90%, rgba(122,90,214,.20), transparent 45%); }
  .wrap { position: relative; max-width: 560px; margin: 0 auto; padding: 28px 18px 48px; }
  h1 { font-size: 26px; font-weight: 800; letter-spacing: .5px;
    background: linear-gradient(120deg, #8fb3ff, #c9a8ff);
    -webkit-background-clip: text; background-clip: text; color: transparent; }
  .sub { color: #8b93b0; font-size: 13px; margin: 6px 0 18px; line-height: 1.6; }
  .bar { position: relative; height: 52px; border-radius: 16px; overflow: hidden; margin-bottom: 20px;
    background: linear-gradient(120deg, #4a63e7, #8a5cf6); display: flex; align-items: center;
    padding: 0 18px; box-shadow: 0 10px 30px rgba(90,100,240,.35); cursor: pointer;
    transition: transform .15s ease; }
  .bar:active { transform: scale(.97); }
  .bar .t { font-weight: 700; font-size: 15px; flex: 1; }
  .bar .n { font-size: 12px; opacity: .85; background: rgba(255,255,255,.2);
    padding: 4px 12px; border-radius: 12px; font-weight: 600; }
  .card { display: flex; align-items: center; gap: 14px; padding: 15px 16px; margin-bottom: 10px;
    border-radius: 16px; background: rgba(255,255,255,.045);
    border: 1px solid rgba(255,255,255,.07); transition: border-color .3s; }
  .card.ok { border-color: rgba(74,222,128,.4); background: rgba(74,222,128,.06); }
  .card.no { border-color: rgba(248,113,113,.4); background: rgba(248,113,113,.06); }
  .card.run { border-color: rgba(139,163,255,.5); }
  .ico { width: 44px; height: 44px; border-radius: 13px; display: flex; align-items: center;
    justify-content: center; font-size: 21px; flex-shrink: 0;
    background: rgba(255,255,255,.07); }
  .mid { flex: 1; min-width: 0; }
  .name { font-size: 15px; font-weight: 700; }
  .hint { font-size: 11.5px; color: #7d86a3; margin-top: 3px; line-height: 1.45;
    overflow: hidden; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; }
  .go { font-size: 12.5px; font-weight: 700; padding: 8px 15px; border-radius: 12px; border: none;
    background: rgba(139,163,255,.16); color: #a8bcff; flex-shrink: 0; transition: all .2s; }
  .go:active { transform: scale(.93); background: rgba(139,163,255,.3); }
  .go:disabled { opacity: .45; }
  .st { font-size: 12px; font-weight: 700; padding: 6px 11px; border-radius: 10px; flex-shrink: 0; }
  .st.idle { color: #7d86a3; background: rgba(255,255,255,.06); }
  .st.ok { color: #4ade80; background: rgba(74,222,128,.14); }
  .st.no { color: #f87171; background: rgba(248,113,113,.14); }
  .sp { width: 14px; height: 14px; border: 2px solid rgba(255,255,255,.2);
    border-top-color: #a8bcff; border-radius: 50%; animation: spin .7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .foot { margin-top: 22px; font-size: 11.5px; color: #5d6480; line-height: 1.8; }
  .foot b { color: #8b93b0; }
  .reset { display: block; margin: 16px auto 0; font-size: 12px; color: #6e7694;
    background: none; border: 1px solid rgba(255,255,255,.1); border-radius: 12px;
    padding: 8px 20px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>🛡️ 权限检测中心</h1>
  <p class="sub">逐个检测织雀授予本页面的手机能力。检测会先弹<b>织雀授权卡</b>，再弹<b>系统权限框</b>——两层都要允许。</p>
  <div class="bar" id="runAll">
    <span class="t">一键全部检测</span>
    <span class="n" id="counter">0 / 13</span>
  </div>
  <div id="list"></div>
  <button class="reset" id="reset">重置全部结果</button>
  <p class="foot"><b>失败排查</b>：详情区会显示真实错误（原样透传，不再吞掉）。常见原因：<br>
  ① 两层弹窗只允许了一层；② 定位/传感器需要系统里先有数据；③ 蓝牙需要手机蓝牙已开启。<br>
  重新授权可在织雀「设置 → 权限中心」修改。检测结果保存在本机。</p>
</div>
<script>
const CAPS = [
  { id: 'camera',    ico: '📷', name: '相机',   hint: '拍摄一张照片（zq.camera.capture）',
    run: () => zq.camera.capture({ dataUrl: false }).then(r => '照片已存：' + (r.path || 'ok').split('/').pop()) },
  { id: 'mic',       ico: '🎤', name: '麦克风', hint: '录制 2 秒音频（zq.mic.record，最长等 5 秒）',
    run: () => zq.mic.record({ seconds: 2 }).then(r => '录音已存：' + (r.path || 'ok').split('/').pop()) },
  { id: 'location',  ico: '📍', name: '定位',   hint: '读取最近位置；为空时用 watch 等 8 秒拿一次实时定位',
    run: () => zq.location.get().then(r => '纬度 ' + (r.lat ?? '?') + '，经度 ' + (r.lng ?? '?'))
      .catch(e => {
        // 首次使用常无 lastKnown：用 watch 等一个实时样本（8 秒）
        return new Promise((res, rej) => {
          let got = false;
          zq.location.watch({ intervalMs: 1000 }).then(w => {
            zq.on(w.sub, v => {
              if (!got) { got = true; zq.location.unwatch({ sub: w.sub }).catch(()=>{}); res('实时定位：纬度 ' + (v.lat ?? '?') + '，经度 ' + (v.lng ?? '?')); }
            });
            setTimeout(() => { if (!got) { zq.location.unwatch({ sub: w.sub }).catch(()=>{}); rej(new Error('8 秒内未拿到定位（请确认系统定位已开启且在开阔处）')); } }, 8000);
          }).catch(rej);
        });
      }) },
  { id: 'sensor',    ico: '📈', name: '传感器', hint: '订阅加速度计（type=accel）收一个样本',
    run: () => new Promise((res, rej) => {
      let got = 0;
      zq.sensor.watch({ type: 'accel' }).then(r => {
        const sub = r.sub;
        zq.on(sub, v => {
          got++;
          if (got === 1) { zq.sensor.unwatch({ sub }).catch(()=>{}); res('样本：' + JSON.stringify(v).slice(0, 70)); }
        });
        setTimeout(() => { if (!got) { zq.sensor.unwatch({ sub }).catch(()=>{}); rej(new Error('2 秒内未收到传感器样本')); } }, 2000);
      }).catch(rej);
    }) },
  { id: 'bluetooth', ico: '📶', name: '蓝牙',   hint: '扫描附近 BLE 设备 3 秒（需手机蓝牙已开启）',
    run: () => zq.bluetooth.scan({ seconds: 3 }).then(r => '扫描完成' + (Array.isArray(r.devices) ? '，发现 ' + r.devices.length + ' 台设备' : '')) },
  { id: 'notification', ico: '🔔', name: '通知', hint: '发送一条系统通知（会先弹通知权限框）',
    run: () => zq.notification.requestPermission().then(() => zq.notification.post({ title: '权限检测', body: '通知能力工作正常 ✓' })).then(() => '通知已发送，看状态栏') },
  { id: 'clipboard', ico: '📋', name: '剪贴板', hint: '写入并读回一次（zq.clipboard）',
    run: () => zq.clipboard.set({ text: '织雀权限检测 ' + Date.now() }).then(() => zq.clipboard.get()).then(r => '读回：' + String(r.text || '').slice(0, 24)) },
  { id: 'share',     ico: '📤', name: '分享',   hint: '弹系统分享面板（zq.share.text）',
    run: () => zq.share.text({ text: '来自织雀权限检测的分享测试' }).then(() => '已唤起分享面板') },
  { id: 'file',      ico: '📁', name: '文件',   hint: '沙盒内写入并读回（zq.file）',
    run: () => zq.file.write({ path: 'check.txt', content: 'ok ' + Date.now() }).then(() => zq.file.read({ path: 'check.txt' })).then(r => '读回：' + String(r.content || '').slice(0, 24)) },
  { id: 'screen',    ico: '🖥️', name: '截屏',   hint: '抓取一帧屏幕（会弹系统投屏授权）',
    run: () => zq.screen.capture({ dataUrl: false }).then(r => '截图已存：' + (r.path || 'ok').split('/').pop()) },
  { id: 'vibrate',   ico: '📳', name: '振动',   hint: 'navigator.vibrate 振动 300ms（W3C 标准，无需授权）',
    run: () => { const ok = navigator.vibrate && navigator.vibrate(300); return ok ? Promise.resolve('已振动 300ms') : Promise.reject(new Error('navigator.vibrate 不可用')); } },
  { id: 'storage',   ico: '💾', name: '本地存储', hint: 'localStorage 写读删一轮（页面数据持久化验证）',
    run: () => { const k = 'zqtest-' + Date.now(); localStorage.setItem(k, 'v1'); const v = localStorage.getItem(k); localStorage.removeItem(k); return v === 'v1' ? Promise.resolve('读写删除一致 ✓') : Promise.reject(new Error('读写不一致')); } },
  { id: 'webgl',     ico: '🧊', name: 'WebGL',  hint: '创建 WebGL 上下文并渲染一帧',
    run: () => { const c = document.createElement('canvas'); const gl = c.getContext('webgl') || c.getContext('experimental-webgl');
      if (!gl) return Promise.reject(new Error('WebGL 上下文创建失败'));
      const s = gl.getParameter(gl.VERSION) + ' · ' + gl.getParameter(gl.RENDERER); return Promise.resolve(s.slice(0, 70)); } },
];

const KEY = 'zhique-perm-check-v2';
let results = {};
try { results = JSON.parse(localStorage.getItem(KEY) || '{}'); } catch (e) { results = {}; }

const list = document.getElementById('list');
const counter = document.getElementById('counter');

function save() { try { localStorage.setItem(KEY, JSON.stringify(results)); } catch (e) {} }

function render() {
  list.innerHTML = '';
  let okCount = 0;
  CAPS.forEach(cap => {
    const r = results[cap.id];
    if (r && r.state === 'ok') okCount++;
    const card = document.createElement('div');
    card.className = 'card' + (r ? (r.state === 'ok' ? ' ok' : r.state === 'no' ? ' no' : '') : '');
    const detail = r && r.detail ? r.detail : cap.hint;
    card.innerHTML =
      '<div class="ico">' + cap.ico + '</div>' +
      '<div class="mid"><div class="name">' + cap.name + '</div>' +
      '<div class="hint">' + detail.replace(/</g, '&lt;') + '</div></div>';
    const btn = document.createElement('button');
    btn.className = r ? ('st ' + (r.state === 'ok' ? 'ok' : 'no')) : 'go';
    btn.textContent = r ? (r.state === 'ok' ? '✓ 通过' : '✕ 失败') : '检测';
    btn.addEventListener('click', () => runOne(cap, btn, card));
    card.appendChild(btn);
    list.appendChild(card);
  });
  counter.textContent = okCount + ' / ' + CAPS.length;
}
function runOne(cap, btn, card) {
  btn.className = 'go'; btn.disabled = true; btn.innerHTML = '<span class="sp"></span>';
  card.classList.add('run');
  const t0 = Date.now();
  Promise.resolve().then(cap.run)
    .then(detail => { results[cap.id] = { state: 'ok', detail: detail + '（' + ((Date.now() - t0) / 1000).toFixed(1) + 's）' }; save(); render(); })
    .catch(err => {
      // 真实错误原样透传（不再吞成"被拒绝"——排查靠它）
      const msg = String((err && err.message) || err);
      results[cap.id] = { state: 'no', detail: '✕ ' + msg.slice(0, 160) };
      save(); render();
    });
}
document.getElementById('runAll').addEventListener('click', async () => {
  for (const cap of CAPS) {
    if (results[cap.id] && results[cap.id].state === 'ok') continue;
    // 逐项同步推进：每项等 1.2s 给两层弹窗留出操作窗口
    await new Promise(done => {
      const card = list.children[CAPS.indexOf(cap)];
      const btn = card ? card.querySelector('.st, .go') : document.createElement('button');
      runOne(cap, btn, card || document.createElement('div'));
      setTimeout(done, 1200);
    });
  }
});
document.getElementById('reset').addEventListener('click', () => { results = {}; save(); render(); });
render();
console.log('权限检测中心 v2 就绪（13 项）');
</script>
</body>
</html>
